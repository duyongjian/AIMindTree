org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 增量编译在本机必须关闭：工程在 D 盘、Pub 缓存在 C 盘
# （C:\Users\ASUS\AppData\Local\Pub\Cache），Kotlin 的 RelocatableFileToPathConverter
# 在把跨盘符的插件源码路径转成相对路径时抛
# IllegalArgumentException: this and base files have different roots，
# 导致 build\<plugin>\kotlin\compileReleaseKotlin\cacheable 缓存写坏、
# :file_picker:compileReleaseKotlin / :shared_preferences_android:compileReleaseKotlin
# 双双失败。关掉增量后每次全量编译，构建慢几秒但不再触发该 bug。
kotlin.incremental=false
