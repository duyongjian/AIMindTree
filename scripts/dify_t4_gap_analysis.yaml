kind: app
version: 0.1.2
app:
  name: AIMindTree 知识缺口分析
  description: 给定单个目标知识点与深度档位，列出理解它直接需要的前置知识点（T4）。输入 target / depth / depth_instruction（自定义可选），输出 gaps JSON（每条建议 name/type/definition/reason/level，level 恒为 1 表示直接前置）。递归由客户端 AutoGraphService 驱动。
  icon: "\U0001F4A1"
  icon_background: '#E5F0FF'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
  current_plugin_version: ''
  installed_plugins: []
workflow:
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  environment_variables: []
  conversation_variables: []
  graph:
    edges:
    - id: start-source-llm-target
      source: start
      target: llm
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: llm
    - id: llm-source-end-target
      source: llm
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 240
      data:
        type: start
        title: 开始
        desc: ''
        variables:
        - variable: target
          label: target
          type: paragraph
          required: true
          max_length: 200000
          options: []
          allowed_file_types: []
          allowed_file_extensions: []
        - variable: depth
          label: depth
          type: text
          required: true
          max_length: 32
          options: []
          allowed_file_types: []
          allowed_file_extensions: []
        - variable: depth_instruction
          label: depth_instruction
          type: paragraph
          required: true
          max_length: 2000
          options: []
          allowed_file_types: []
          allowed_file_extensions: []
    - id: llm
      type: custom
      position:
        x: 400
        y: 180
      data:
        type: llm
        title: LLM 找直接前置
        desc: ''
        model:
          provider: ollama
          name: llama3
          mode: chat
          completion_params:
            temperature: 0.4
            # 推理模型会先吐 <think> 思考块，吃掉 token 预算导致 JSON 被截断；
            # 这里务必留足，否则深层/多建议时输出会截在半截（客户端解析失败）。
            max_tokens: 4096
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        prompt_template:
        - role: system
          text: |-
            你是一名严谨的「学习路径规划师」，服务于一款叫 AIMindTree 的 AI 知识笔记 App。
            给定**单个目标知识点**，你的任务是列出理解它**直接需要**的前置知识点（即 level=1，
            只往前推一层，不要做多跳递归）。
        - role: user
          text: |-
            请分析下面这个**单个目标知识点**，找出掌握它之前应当先掌握的直接前置知识点。

            # 目标知识点
            {{#start.target#}}

            # 深度档位
            {{#start.depth#}}
            （low=大学/高中入门级，只列最近一层；medium=初中/高中基础；high=小学/常识级，可更基础；
            custom=由下方自定义指令决定）

            {% if start.depth_instruction %}
            # 自定义深度指令
            {{#start.depth_instruction#}}
            {% endif %}

            # 输出要求（严格遵守）
            1. 只输出一个 JSON 对象，不要任何解释、前后缀或 Markdown 代码块标记。
            2. 结构固定为：
            {
              "gaps": [
                {
                  "name": "前置知识点的名称（名词短语，≤ 20 字）",
                  "type": "概念|公式|定理|方法|事实|误区",
                  "definition": "一句话定义（≤ 60 字）",
                  "reason": "为什么需要先掌握它才能理解目标（≤ 40 字）",
                  "level": 1
                }
              ]
            }
            3. 只输出**直接**前置（再往前的基础不要列，客户端会递归展开）；最多 15 条。
            4. name 必须是具体概念，不要用「基础知识」之类空泛词；不要编造目标里没有依据的前置。
            5. 每条 reason 要说明为何先于目标掌握。
    - id: end
      type: custom
      position:
        x: 740
        y: 240
      data:
        type: end
        title: 结束
        desc: ''
        outputs:
        - variable: gaps
          value_type: string
          value: '{{#llm.text#}}'
    viewport:
      x1: 0
      y1: 0
      x2: 0
      y2: 0
