# llm_server/config.yaml —— 全部字段均有默认值，最小化可只写 default_backend
#
# 改完不用重启进程：POST /v1/admin/reload（提示词改完是 POST /v1/prompts/reload）。

server:
  host: 127.0.0.1
  port: 8787
  log_level: info          # debug|info|warning|error
  verbose: false           # true = 打印完整 prompt/response（S-15）
  # httpx 是否跟随环境变量里的 HTTP_PROXY / HTTPS_PROXY。
  # 默认 false：本机若有开发代理（如 127.0.0.1:xxxxx），true 会把 127.0.0.1:11434
  # 的本地 Ollama 请求也发给代理，表现为「本机后端连不上」的假故障。
  # 只有在**必须**走公司代理才能访问云端后端时才改成 true。
  trust_env_proxy: false
  cors_origins:
    - http://127.0.0.1
    - http://localhost

# 默认后端（D11：不做按任务强制，统一走这里；task_backends 留空）
# 2026-10-21：切回本地 Ollama（零成本、无限额）。MiniMax 云端保留为可选后端，
# 其账户当前无有效 Token 套餐（/v1/admin/balance 会报 available:false），需要时再切。
default_backend: ollama

# 按任务覆盖（可选；未列出的任务走 default_backend）
# 例：把 T1 单独切到云端：
#   task_backends:
#     T1: minimax
task_backends: {}

timeouts:
  structured_s: 120        # 与 App 侧 AiProvider.runTask.timeout 对齐（N-8）
  chat_s: 120
  connect_s: 10
  health_s: 5              # /health 里各后端探测（并发，不阻塞响应）

retry:
  structured_on_bad_json: 1   # 六层容错失败后原地重跑次数（S-13）

backends:
  # ---- 后端一：Ollama（本地，当前默认）----
  # 前置：ollama serve 已在跑，且 pull 过下面列出的模型。
  # 本机实测（2026-10-21，i7-13650HX + 独显，`ollama ps` 确认 100% GPU）：
  #   qwen3:8b-8k     5.2 GB   ≈ 46 tok/s  ← 默认：由 ollama/Modelfile.qwen3-8k 派生
  #   qwen3:8b        5.2 GB   ≈ 0.3 tok/s ← 原厂默认 num_ctx=40960 → 撑爆显存 → 46%/54% CPU/GPU
  #   qwen2.5:0.5b    397 MB   ≈ 111 tok/s ← 极快，但能力太弱（只回抄 schema，T1 抽不出可用锚点）
  # 经验：Ollama 的 /v1/chat/completions 不接受 num_ctx，只能靠派生模型固定上下文。
  # 没起 Ollama 不影响服务启动，只是 /health 里 reachable=false（Q-I）。
  # ⚠️ 模型名必须与 `ollama list` 完全一致（含 tag），否则首次请求报「模型不存在」。
  ollama:
    type: ollama
    protocol: openai_compat
    base_url: http://127.0.0.1:11434
    api_key_env: ""                    # 本地无需密钥
    default_model: qwen3:8b-8k         # ← 派生模型（num_ctx=8192），与 ollama list 一致
    models: [qwen3:8b-8k, qwen3:8b, qwen2.5:0.5b]
    extra:
      num_ctx: 8192
      json_mode_field: format   # P0 可选：Ollama 的 format=json

  # ---- 后端二：MiniMax（云端，当前默认后端）----
  # 2026-10-21 起默认走 openai_compat（/v1/chat/completions，MiniMax OpenAI 兼容形态）；
  # 若你的 Key 是 Anthropic 形态，把 protocol 改成 anthropic_compat 即可（一行切换）。
  # 端点统一收口到 api.minimax.cn（旧域 api.minimaxi.com 已废弃）。
  minimax:
    type: minimax
    protocol: openai_compat      # 可改 anthropic_compat（/anthropic/v1/messages）
    base_url: https://api.minimax.cn
    anthropic_path: /anthropic/v1/messages
    openai_path: /v1/chat/completions
    api_key_env: MINIMAX_API_KEY
    default_model: MiniMax-M2.5
    anthropic_version: 2023-06-01
    extra:
      max_tokens: 4096
      # MiniMax 余额/额度端点（Token 套餐剩余）。
      # GET {base_url}{balance_path}，头 Authorization: Bearer <订阅Key>。
      # 也可在管理后台 /admin 的「余额」区查询。
      balance_path: /v1/token_plan/remains

  # ---- 后端三：任意 OpenAI 兼容端点 ----
  # DeepSeek / 通义 / Kimi / 硅基流动 / 本地 vLLM / LM Studio 都填这里。
  openai_compat:
    type: openai_compat
    protocol: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o-mini
    models: []
