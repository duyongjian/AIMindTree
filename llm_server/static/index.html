<html lang="zh-CN">
<head>

  <title>AIMindTree · AI 服务管理后台</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <aside id="nav">
    <div class="brand">
      <span class="brand-name">AIMindTree</span>
      <span class="brand-sub">AI 服务管理后台</span>
    </div>
    <nav>
      <div class="nav-group">配置</div>
      <a class="nav-item" href="#/m2" data-page="m2">LLM Provider</a>
      <a class="nav-item" href="#/m3" data-page="m3">App 下发配置</a>
      <a class="nav-item" href="#/m4" data-page="m4">任务路由</a>
      <a class="nav-item" href="#/m5" data-page="m5">提示词管理</a>
      <a class="nav-item" href="#/m8" data-page="m8">同步配置</a>

      <div class="nav-group">观测</div>
      <a class="nav-item" href="#/m1" data-page="m1">概览</a>
      <a class="nav-item" href="#/m7" data-page="m7">运行日志</a>
      <a class="nav-item" href="#/m10" data-page="m10">任务队列</a>
      <a class="nav-item" href="#/m6" data-page="m6">任务调试台</a>

      <div class="nav-group">运维</div>
      <a class="nav-item" href="#/m9" data-page="m9">备份与系统信息</a>
      <a class="nav-item" href="#/m11" data-page="m11">云端同步</a>
    </nav>
    <div class="nav-foot">
      <span id="navVersion">—</span>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div>
        <h1 id="pageTitle">概览</h1>
        <p id="pageHint"></p>
      </div>
      <div class="top-actions">
        <button id="btnReloadConfig" class="btn ghost" type="button">重载配置</button>
        <button id="btnReloadPrompts" class="btn ghost" type="button">重载提示词</button>
        <button id="btnRefresh" class="btn" type="button">刷新</button>
      </div>
    </header>

    <main id="view">
      <section class="page" data-page="m1" hidden></section>
      <section class="page" data-page="m2" hidden></section>
      <section class="page" data-page="m3" hidden></section>
      <section class="page" data-page="m4" hidden></section>
      <section class="page" data-page="m5" hidden></section>
      <section class="page" data-page="m6" hidden></section>
      <section class="page" data-page="m7" hidden></section>
      <section class="page" data-page="m8" hidden></section>
      <section class="page" data-page="m9" hidden></section>
      <section class="page" data-page="m10" hidden></section>
      <section class="page" data-page="m11" hidden></section>
    </main>
  </div>

  <!-- 保住浏览器原生 prompt：api.js 里的全局 prompt(task, variant) 帮助函数会覆盖
       window.prompt（同名全局函数声明），M11 危险区的「手输 RESET」要用原生的，
       所以在加载 api.js **之前**先存一份引用。 -->
  <script>window.__nativePrompt = window.prompt ? window.prompt.bind(window) : null;</script>
  <script src="/static/api.js"></script>
  <script src="/static/views-a.js"></script>
  <script src="/static/views-b.js"></script>
  <script src="/static/views-c.js"></script>
  <script src="/static/views-d.js"></script>
  <script src="/static/views-e.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
