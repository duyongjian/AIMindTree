<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIMindTree · LLM 管理后台</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --line: #e3e8f0;
      --text: #1f2733;
      --muted: #6b7785;
      --brand: #2f6fed;
      --brand-soft: #eaf1ff;
      --ok: #1f9d57;
      --ok-soft: #e7f6ee;
      --bad: #d6453d;
      --bad-soft: #fdecea;
      --warn: #c98a00;
      --shadow: 0 1px 3px rgba(20, 30, 50, .08), 0 6px 18px rgba(20, 30, 50, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      padding: 18px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .wrap { max-width: 920px; margin: 22px auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    .card h2 { margin: 0 0 14px; font-size: 15px; color: var(--text); }
    .card h2 .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    label:first-of-type { margin-top: 0; }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 9px 11px;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    select:focus, input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .hidden { display: none !important; }
    .actions { margin-top: 18px; display: flex; align-items: center; gap: 12px; }
    button {
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #245ad1; }
    button:disabled { opacity: .55; cursor: default; }
    .msg { font-size: 13px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--bad); }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.bad { background: var(--bad-soft); color: var(--bad); }
    .badge.warn { background: #fbf2da; color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    pre {
      background: #f7f9fc; border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; font-size: 12px; overflow: auto; max-height: 220px; margin: 8px 0 0;
      white-space: pre-wrap; word-break: break-all;
    }
    .kv { font-size: 13px; }
    .kv div { padding: 5px 0; border-bottom: 1px dashed var(--line); }
    .kv div:last-child { border-bottom: none; }
    .kv .k { color: var(--muted); display: inline-block; width: 110px; }
    .spinner { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>AIMindTree · LLM 管理后台</h1>
    <p>切换后端 / 协议与模型、配置 MiniMax 密钥、查询余额；保存即热重载，无需重启进程。</p>
  </header>

  <div class="wrap">
    <!-- 配置卡片 -->
    <div class="card">
      <h2>运行配置 <span class="hint">保存后立即生效</span></h2>

      <label for="backend">后端 Backend</label>
      <select id="backend"></select>

      <div id="protocolWrap" class="hidden">
        <label for="protocol">协议 Protocol（仅 MiniMax）</label>
        <select id="protocol">
          <option value="openai_compat">openai_compat（/v1/chat/completions）</option>
          <option value="anthropic_compat">anthropic_compat（/anthropic/v1/messages）</option>
        </select>
      </div>

      <label for="model">模型 Model</label>
      <div class="row">
        <div>
          <select id="modelSelect"></select>
        </div>
        <div>
          <input id="modelCustom" type="text" placeholder="自定义模型 ID（如 MiniMax-M2.5）" />
        </div>
      </div>

      <label for="apiKey">MiniMax API Key（可选，保存到 settings.json）</label>
      <input id="apiKey" type="password" placeholder="留空则不修改已保存的密钥" autocomplete="off" />

      <div class="actions">
        <button id="saveBtn">保存</button>
        <span id="saveMsg" class="msg"></span>
      </div>
    </div>

    <!-- 状态卡片 -->
    <div class="card">
      <h2>服务状态 <span class="hint">/health</span></h2>
      <div id="healthBox" class="spinner">加载中…</div>
    </div>

    <!-- 余额卡片 -->
    <div class="card">
      <h2>MiniMax 余额 / 额度 <span class="hint">/v1/admin/balance</span></h2>
      <div id="balanceBox" class="spinner">加载中…</div>
    </div>
  </div>

  <script>
    "use strict";

    var DEFAULT_MODEL = "MiniMax-M2.5";

    function el(id) { return document.getElementById(id); }

    async function getJSON(url) {
      var resp = await fetch(url, { cache: "no-store" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return await resp.json();
    }

    async function postJSON(url, body) {
      var resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      return await resp.json();
    }

    // ---------- 初始化：拉取当前配置 ----------
    var config = null;

    async function loadConfig() {
      config = await getJSON("/v1/admin/config");
      var backendSel = el("backend");
      backendSel.innerHTML = "";
      (config.backends || []).forEach(function (b) {
        var opt = document.createElement("option");
        opt.value = b.name;
        opt.textContent = b.name + "（默认模型：" + (b.default_model || "—") + "）";
        backendSel.appendChild(opt);
      });
      if (config.default_backend) backendSel.value = config.default_backend;

      // 默认模型：优先用服务端当前值
      el("modelCustom").value = config.default_model || DEFAULT_MODEL;
      onBackendChange();
    }

    function onBackendChange() {
      var name = el("backend").value;
      var isMini = name === "minimax";
      el("protocolWrap").classList.toggle("hidden", !isMini);
      loadModels(name);
    }

    async function loadModels(backend) {
      var sel = el("modelSelect");
      sel.innerHTML = "<option value=''>— 从列表选择 —</option>";
      try {
        var data = await getJSON("/v1/admin/models?backend=" + encodeURIComponent(backend));
        var models = (data && data.models) || [];
        models.forEach(function (m) {
          var opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          sel.appendChild(opt);
        });
      } catch (e) {
        var opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "（无法获取模型列表）";
        sel.appendChild(opt);
      }
      // 若自定义框里的值在列表里，同步选中
      var cur = el("modelCustom").value;
      if (cur) {
        var found = false;
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === cur) { sel.selectedIndex = i; found = true; break; }
        }
        if (!found) sel.selectedIndex = 0;
      }
    }

    el("modelSelect").addEventListener("change", function () {
      if (this.value) el("modelCustom").value = this.value;
    });
    el("backend").addEventListener("change", onBackendChange);

    // ---------- 保存 ----------
    el("saveBtn").addEventListener("click", async function () {
      var btn = this;
      btn.disabled = true;
      var msg = el("saveMsg");
      msg.textContent = "保存中…";
      msg.className = "msg";

      var body = {};
      var name = el("backend").value;
      if (config && name !== config.default_backend) body.default_backend = name;
      var model = (el("modelCustom").value || "").trim();
      if (model) body.default_model = model;
      if (name === "minimax") {
        var proto = el("protocol").value;
        if (config && proto !== "openai_compat") body.minimax_protocol = proto;
      }
      var key = el("apiKey").value;
      if (key) body.minimax_api_key = key;

      try {
        var result = await postJSON("/v1/admin/config", body);
        if (result && result.backends) {
          msg.textContent = "已保存，已热重载 ✅";
          msg.className = "msg ok";
          el("apiKey").value = "";  // 清空密码框，避免误存
          await loadConfig();
          await refreshStatus();
        } else {
          msg.textContent = "保存返回异常：" + JSON.stringify(result);
          msg.className = "msg err";
        }
      } catch (e) {
        msg.textContent = "保存失败：" + e.message;
        msg.className = "msg err";
      } finally {
        btn.disabled = false;
      }
    });

    // ---------- 状态区 ----------
    function badge(reachable) {
      if (reachable) return '<span class="badge ok">可达</span>';
      return '<span class="badge bad">不可达</span>';
    }

    async function refreshHealth() {
      var box = el("healthBox");
      box.className = "spinner";
      box.textContent = "加载中…";
      try {
        var h = await getJSON("/health");
        var html = "";
        html += '<div class="kv"><div><span class="k">服务</span>' +
          (h.status || "?") + ' · v' + (h.version || "") + ' · uptime ' + (h.uptime_s ?? "?") + 's</div>';
        html += '<div><span class="k">默认后端</span>' + (h.default_backend || "—") + '</div>';
        html += '<div><span class="k">提示词</span>' + (h.prompts_loaded ?? "?") + ' 个</div></div>';
        html += '<table><thead><tr><th>后端</th><th>状态</th><th>Base URL</th><th>模型</th></tr></thead><tbody>';
        (h.backends || []).forEach(function (b) {
          html += "<tr><td>" + b.name + "</td><td>" + badge(b.reachable) +
            (b.error ? ' <span class="badge warn"> ' + escapeHtml(String(b.error)) + '</span>' : "") +
            "</td><td class='mono'>" + escapeHtml(b.base_url || "") + "</td><td class='mono'>" +
            escapeHtml((b.models || []).join(", ")) + "</td></tr>";
        });
        html += "</tbody></table>";
        box.className = "";
        box.innerHTML = html;
      } catch (e) {
        box.className = "";
        box.innerHTML = '<span class="badge bad">获取失败：' + escapeHtml(e.message) + "</span>";
      }
    }

    async function refreshBalance() {
      var box = el("balanceBox");
      box.className = "spinner";
      box.textContent = "加载中…";
      try {
        var r = await getJSON("/v1/admin/balance");
        var ok = !!r.available;
        var html = "";
        html += '<div class="kv"><div><span class="k">可用</span>' +
          (ok ? '<span class="badge ok">是</span>' : '<span class="badge bad">否</span>') + "</div>";
        html += "<div><span class='k'>错误</span>" +
          (r.error ? escapeHtml(String(r.error)) : "无") + "</div></div>";
        if (r.raw !== null && r.raw !== undefined) {
          html += "<pre>" + escapeHtml(JSON.stringify(r.raw, null, 2)) + "</pre>";
        } else if (!ok) {
          html += "<pre>无 raw 数据（" + escapeHtml(String(r.error || "")) + "）</pre>";
        }
        box.className = "";
        box.innerHTML = html;
      } catch (e) {
        box.className = "";
        box.innerHTML = '<span class="badge bad">查询失败：' + escapeHtml(e.message) + "</span>";
      }
    }

    async function refreshStatus() {
      await Promise.all([refreshHealth(), refreshBalance()]);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    // 启动
    (async function init() {
      try {
        await loadConfig();
      } catch (e) {
        el("backend").innerHTML = '<option>无法加载配置</option>';
      }
      await refreshStatus();
    })();
  </script>
</body>
</html>
