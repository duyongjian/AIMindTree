# Netlify 部署配置 · AIMindTree 同步中继
#
# 部署方式（控制台/API，不靠浏览器插件点选）：
#   1. 在 Netlify 控制台「Import from Git」选 GitHub 仓库 AIMindTree，根目录填
#      `sync_relay_netlify`（只部署这个子目录）。或 CLI：`npx netlify link` + `npx netlify deploy`。
#   2. 本文件已声明 functions 目录与 rewrite 路由，无需额外配置即可部署。
#   3. 默认是 preview 部署；确认无误后 `npx netlify deploy --prod` 推生产。
#
# 路由说明：Netlify Functions 没有 Vercel 那种文件级 catch-all，故用 rewrite（200）
# 把 `/`、`/auth/*`、`/sync/*` 全部转发到同一个函数 `.netlify/functions/sync`，并带
# `:splat` 保留原始子路径（否则 rewrite 会丢掉 /auth、/sync 前缀）。函数内
# `sync.js` 再剥掉 `/.netlify/functions/sync` 挂载前缀，还原出逻辑路径，使
# relay.js 的契约匹配（`endsWith('/auth/register')` 等）稳定生效。无论 Netlify
# 是保留原始 URL 还是改写为挂载路径，路由都正确。

[build]
  # 纯 Functions 项目，无需构建命令；publish 指向一个占位目录（Netlify 要求 publish 存在）。
  publish = "public"
  functions = "netlify/functions"

# Functions 2.0 开关（官方口径）：esbuild 打包 + 原生 ESM export default 签名。
# v2 才会按请求注入 Netlify Blobs 上下文（globalThis.netlifyBlobsContext /
# NETLIFY_BLOBS_CONTEXT）——v1（lambda 式）不注入，getStore 直接抛
# MissingBlobsEnvironmentError（2026-10-24 实测踩坑）。
[functions]
  node_bundler = "esbuild"

# 把同步中继的所有路径收口到同一个 Netlify Function（rewrite，非 301）。带 :splat 保留子路径。
[[redirects]]
  from = "/"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/sync/auth/:splat"
  status = 200

[[redirects]]
  from = "/sync/*"
  to = "/.netlify/functions/sync/sync/:splat"
  status = 200

# 管理接口（/admin/ping、/admin/stats、/admin/users、/admin/reset、
# /admin/user/:id、/admin/export）：同一函数分发，默认关闭，靠 ADMIN_TOKEN 开启。
[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/sync/admin/:splat"
  status = 200
