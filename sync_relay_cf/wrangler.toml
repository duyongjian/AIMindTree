# Cloudflare Worker + D1 同步中继配置（方案 B）。
# 部署前：把 database_id 换成你自己的 D1 实例 id（wrangler d1 create aimindtree_sync）。

name = "aimindtree-sync-relay"
main = "worker.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "aimindtree_sync"
database_id = "14844c5f-d825-4bce-8404-324560b7bc7f"

# 传输层鉴权令牌（可选）：通过 `wrangler secret put SYNC_TOKEN` 注入（不写进本文件）。
# 设为空 = 开放部署（不校验共享 token）。
# 注意：开放部署下所有数据落入同一张全局表、pull 不做按用户隔离，仅适合个人/单机使用。
# 若要给普通用户做多租户隔离，请走「账号登录」方案（见仓库 sync_relay_cf/README.md 的
# 多租户设计），此时无需设置 SYNC_TOKEN——每个用户用各自的账号令牌访问自己的命名空间。
