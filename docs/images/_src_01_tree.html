<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:720px;background:linear-gradient(135deg,#0a1628 0%,#12233f 55%,#0d1b32 100%);color:#fff;font-family:'Microsoft YaHei','Segoe UI',sans-serif;overflow:hidden;position:relative}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(52,211,153,.12),transparent 40%),radial-gradient(circle at 10% 90%,rgba(139,92,246,.12),transparent 45%)}
.head{position:relative;padding:34px 48px 0;z-index:2}
.badge{display:inline-flex;align-items:center;gap:9px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#6ee7b7;font-size:15px;font-weight:700;padding:7px 15px;border-radius:20px;letter-spacing:.5px}
h1{font-size:40px;margin:16px 0 6px;letter-spacing:1px}
h1 .g{background:linear-gradient(90deg,#34d399,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#94a3b8;font-size:18px;margin:0}
.canvas{position:absolute;left:48px;right:48px;top:168px;bottom:118px;border-radius:20px;background-color:rgba(8,20,38,.55);background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px);background-size:28px 28px;border:1px solid rgba(148,163,184,.18);overflow:hidden}
.svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.node{position:absolute;width:196px;min-height:78px;border-radius:14px;padding:14px 16px;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.node .t{font-size:16px;font-weight:700;line-height:1.3}
.node .m{font-size:12px;margin-top:8px;display:flex;align-items:center;gap:6px;opacity:.9}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.green{background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(6,95,70,.35));border:1.5px solid #34d399}
.green .m{color:#6ee7b7}.green .dot{background:#34d399}
.yellow{background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(120,53,15,.32));border:1.5px solid #f59e0b}
.yellow .m{color:#fcd34d}.yellow .dot{background:#f59e0b}
.red{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(120,20,20,.32));border:1.5px solid #ef4444}
.red .m{color:#fca5a5}.red .dot{background:#ef4444}
.hl{box-shadow:0 0 0 2px rgba(96,165,250,.55),0 12px 34px rgba(0,0,0,.4)}
.card{position:absolute;z-index:3;width:210px;background:linear-gradient(135deg,#1e3a5f,#152941);border:1.5px solid #60a5fa;border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.card .ch{font-size:12px;color:#93c5fd;font-weight:700;margin-bottom:6px}
.card .cb{font-size:13.5px;line-height:1.45;color:#e2e8f0}
.toolbar{position:absolute;right:18px;bottom:16px;z-index:4;display:flex;gap:8px;background:rgba(15,30,52,.9);border:1px solid rgba(148,163,184,.3);padding:8px 10px;border-radius:12px}
.toolbar div{width:34px;height:34px;border-radius:8px;background:rgba(148,163,184,.14);display:flex;align-items:center;justify-content:center;font-size:17px}
.toolbar div.on{background:#34d399;color:#06251a;font-weight:700}
.legend{position:absolute;left:18px;top:16px;z-index:4;display:flex;gap:16px;background:rgba(15,30,52,.82);border:1px solid rgba(148,163,184,.25);padding:9px 14px;border-radius:10px;font-size:12.5px;color:#cbd5e1}
.legend span{display:flex;align-items:center;gap:6px}
.feats{position:absolute;left:0;right:0;bottom:34px;z-index:2;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 40px}
.feat{font-size:14px;color:#cbd5e1;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.2);padding:7px 14px;border-radius:20px}
.feat b{color:#6ee7b7}
</style></head><body>
<div class="head">
  <div class="badge">🌳 AIMindTree · 核心特色</div>
  <h1>让笔记长成一棵 <span class="g">知识树</span></h1>
  <p class="sub">AI 抽出知识点、理清前置关系，把抽象知识变成一张可动手整理的地图</p>
</div>

<div class="canvas">
  <svg class="svg" viewBox="0 0 1104 434" preserveAspectRatio="none">
    <defs>
      <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    </defs>
    <path d="M214,196 C300,196 300,118 388,118" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
    <path d="M214,216 C300,230 300,320 388,330" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
    <path d="M586,140 C660,140 680,214 748,224" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
    <path d="M586,352 C660,352 680,270 748,256" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
    <path d="M986,232 C1000,232 1000,150 1034,146" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
    <path d="M986,258 C1000,258 1000,360 1034,366" stroke="#ef4444" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  </svg>

  <div class="legend">
    <span><i class="dot" style="background:#34d399"></i>已掌握</span>
    <span><i class="dot" style="background:#f59e0b"></i>学习中</span>
    <span><i class="dot" style="background:#ef4444"></i>未掌握（前置不足）</span>
  </div>

  <div class="node green" style="left:18px;top:158px">
    <div class="t">线性代数基础</div>
    <div class="m"><i class="dot"></i>已掌握 · 根知识点</div>
  </div>
  <div class="node green" style="left:388px;top:80px">
    <div class="t">矩阵运算</div>
    <div class="m"><i class="dot"></i>已掌握</div>
  </div>
  <div class="node yellow" style="left:388px;top:292px">
    <div class="t">特征值与特征向量</div>
    <div class="m"><i class="dot"></i>学习中</div>
  </div>
  <div class="node yellow hl" style="left:748px;top:186px">
    <div class="t">主成分分析 PCA</div>
    <div class="m"><i class="dot"></i>学习中 · 3 个前置</div>
  </div>
  <div class="node red" style="left:890px;top:104px">
    <div class="t">奇异值分解 SVD</div>
    <div class="m"><i class="dot"></i>未掌握 · 前置不足</div>
  </div>
  <div class="node red" style="left:890px;top:288px">
    <div class="t">推荐系统</div>
    <div class="m"><i class="dot"></i>未掌握 · 前置不足</div>
  </div>

  <div class="card" style="left:604px;top:296px">
    <div class="ch">💬 追问沉淀的卡片</div>
    <div class="cb">“为什么 PCA 能用特征值降维？”——每次追问都变成贴在旁边的一张小卡片</div>
  </div>

  <div class="toolbar">
    <div>✥</div><div>✋</div><div class="on">▣</div><div>＋</div><div>－</div>
  </div>
</div>

<div class="feats">
  <div class="feat">🔍 <b>缩放</b> / 平移</div>
  <div class="feat">🖱 <b>节点拖拽</b></div>
  <div class="feat">🔗 <b>连线</b>建前置</div>
  <div class="feat">▣ <b>框选</b>多节点</div>
  <div class="feat">⌗ <b>网格吸附</b></div>
  <div class="feat">🔄 <b>掌握度级联</b>降级</div>
</div>
</body></html>
